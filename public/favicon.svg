<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient (Deep High-Contrast Navy) -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f24" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Vibrant Electric Border -->
    <linearGradient id="border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>

    <!-- Letter E Gradient -->
    <linearGradient id="eCol" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a5b4fc" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <!-- Letter W Gradient -->
    <linearGradient id="wCol" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle Card (High Contrast, Crisp Border) -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)" stroke="url(#border)" stroke-width="20" />

  <!-- Monogram REW - Extra Bold, High Luminance for 16px/32px Readability -->
  <g id="rew-letters" transform="translate(36, 120)">
    
    <!-- Letter R: Bold Pure White -->
    <path d="M 16 0 
             L 106 0 
             C 148 0, 172 24, 172 68 
             C 172 108, 146 132, 110 138 
             L 174 272 
             L 116 272 
             L 66 154 
             L 66 272 
             L 16 272 
             Z 
             M 66 44 
             L 66 110 
             L 100 110 
             C 118 110, 128 98, 128 78 
             C 128 58, 118 44, 100 44 
             Z" 
          fill="#ffffff" />

    <!-- Letter E: Electric Violet / Indigo -->
    <path d="M 160 0 
             L 268 0 
             L 268 46 
             L 210 46 
             L 210 112 
             L 260 112 
             L 260 158 
             L 210 158 
             L 210 226 
             L 270 226 
             L 270 272 
             L 160 272 
             Z" 
          fill="url(#eCol)" />

    <!-- Letter W: Luminous Warm Gold -->
    <path d="M 264 0 
             L 308 0 
             L 336 172 
             L 366 0 
             L 410 0 
             L 410 272 
             L 366 272 
             L 366 94 
             L 336 272 
             L 304 94 
             L 304 272 
             L 264 272 
             Z" 
          fill="url(#wCol)" />
  </g>

  <!-- Power Spark Dot (Top-Right) -->
  <circle cx="424" cy="90" r="16" fill="#fbbf24" filter="url(#glow)" />
  <circle cx="424" cy="90" r="8" fill="#ffffff" />
</svg>