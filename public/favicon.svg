<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient (Deep Navy Slate) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080d1a" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Border Glow Gradient (Electric Indigo to Amber Gold) -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Letter E Gradient -->
    <linearGradient id="eGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <!-- Letter W Gradient (Luminous Gold) -->
    <linearGradient id="wGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle Card -->
  <rect x="20" y="20" width="472" height="472" rx="108" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="16" />

  <!-- Monogram REW - Crisp, Bold Geometric Architecture -->
  <g id="rew-monogram" filter="url(#glow)">
    
    <!-- 1. Letter R (Bold White) -->
    <path d="M 68 146
             L 136 146
             C 166 146, 184 164, 184 196
             C 184 224, 166 242, 140 248
             L 186 366
             L 144 366
             L 104 262
             L 104 366
             L 68 366
             Z
             M 104 178
             L 104 230
             L 132 230
             C 146 230, 154 220, 154 204
             C 154 188, 146 178, 132 178
             Z"
          fill="#ffffff" />

    <!-- 2. Letter E (Electric Indigo) -->
    <path d="M 206 146
             L 294 146
             L 294 180
             L 242 180
             L 242 236
             L 286 236
             L 286 270
             L 242 270
             L 242 332
             L 296 332
             L 296 366
             L 206 366
             Z"
          fill="url(#eGrad)" />

    <!-- 3. Letter W (Vibrant Amber Gold) -->
    <path d="M 314 146
             L 348 146
             L 374 278
             L 398 146
             L 426 146
             L 452 278
             L 478 146
             L 510 146
             L 470 366
             L 438 366
             L 412 238
             L 386 366
             L 354 366
             Z"
          transform="scale(0.88) translate(38, 26)"
          fill="url(#wGrad)" />
  </g>

  <!-- Spark Dot Top-Right -->
  <circle cx="414" cy="98" r="14" fill="#fbbf24" filter="url(#glow)" />
  <circle cx="414" cy="98" r="7" fill="#ffffff" />
</svg>
