<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.9" />
    </linearGradient>

    <!-- REW Monogram Letter Gradient -->
    <linearGradient id="letterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#e0e7ff" />
      <stop offset="70%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>

    <!-- Accent Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle Card -->
  <rect x="16" y="16" width="480" height="480" rx="108" ry="108" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="12" />

  <!-- Monogram REW - Unified Interlocking Geometric Geometry -->
  <g transform="translate(48, 116)" filter="url(#subtleGlow)">
    
    <!-- Letter R -->
    <path d="M 16 0 
             L 94 0 
             C 138 0, 168 28, 168 68 
             C 168 102, 142 126, 108 132 
             L 168 260 
             L 114 260 
             L 64 148 
             L 64 260 
             L 16 260 
             Z 
             M 64 44 
             L 64 104 
             L 92 104 
             C 114 104, 124 92, 124 74 
             C 124 56, 114 44, 92 44 
             Z" 
          fill="#ffffff" />

    <!-- Letter E (Interlocked with R & W) -->
    <path d="M 152 0 
             L 256 0 
             L 256 44 
             L 196 44 
             L 196 108 
             L 248 108 
             L 248 152 
             L 196 152 
             L 196 216 
             L 260 216 
             L 260 260 
             L 152 260 
             Z" 
          fill="url(#letterGrad)" />

    <!-- Letter W (Dynamic Forward Stride) -->
    <path d="M 252 0 
             L 296 0 
             L 328 172 
             L 362 0 
             L 404 0 
             L 404 260 
             L 362 260 
             L 362 88 
             L 328 260 
             L 294 88 
             L 294 260 
             L 252 260 
             Z" 
          fill="url(#goldGrad)" />
  </g>

  <!-- High-Tech Core Spark Dot -->
  <circle cx="420" cy="92" r="14" fill="#fbbf24" filter="url(#subtleGlow)" />
  <circle cx="420" cy="92" r="7" fill="#ffffff" />
</svg>
